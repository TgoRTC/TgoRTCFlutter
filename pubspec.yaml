name: tgortcflutter
description: "A Flutter SDK for audio and video calling based on LiveKit. Provides easy-to-use APIs for room management, participant tracking, and media control."
version: 1.0.1
homepage: https://github.com/TgoRTC/TgoRTCFlutter
repository: https://github.com/TgoRTC/TgoRTCFlutter
issue_tracker: https://github.com/TgoRTC/TgoRTCFlutter/issues

topics:
  - livekit
  - webrtc
  - video-call
  - audio-call
  - real-time-communication

environment:
  sdk: ">=2.17.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.3.6
  flutter_webrtc: ^0.12.12+hotfix.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0

dependency_overrides:
  flutter_webrtc:
    git:
      url: "https://gitcode.com/openharmony-sig/fluttertpc_flutter_webrtc.git"
  livekit_client:
    git:
      url: "https://gitcode.com/openharmony-sig/fluttertpc_livekit_client.git"
  meta: 1.8.0
  # 解决 flutter_webrtc 与 flutter_test 的 collection 版本冲突
  collection: 1.17.1